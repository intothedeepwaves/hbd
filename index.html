<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 콘텐츠 페이지</title>
<style>
  :root{
    --bg: #0b0b0c;
    --card-bg: #1a1a1c;
    --text: #f5f5f5;
    --muted: #b8b8b8;
    --accent: #ff2d3a; /* 재생 버튼 포인트 색상 */
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", sans-serif;
  }

  .screen{
    max-width: 430px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ---------- 상단 헤더 ---------- */
  .header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .header h1{
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .search-icon{
    width: 26px;
    height: 26px;
    color: var(--text);
  }

  /* ---------- 태그 버튼 ---------- */
  .tag-row{
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tag-btn{
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid #555;
    color: var(--text);
    font-size: 14px;
    text-decoration: none;
    white-space: nowrap;
  }

  .tag-btn:active{
    background: #2a2a2c;
  }

  /* ---------- 메인 카드 ---------- */
  .main-card{
    border-radius: 18px;
    overflow: hidden;
    background: var(--card-bg);
    margin-bottom: 28px;
  }

  .main-card .media{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #333;
    overflow: hidden;
  }

  .main-card .media > img.bg-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .media-top{
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
    flex-shrink: 0;
    display: block;
  }

  .media-top .names{
    line-height: 1.2;
  }

  .media-top .channel-name{
    font-weight: 700;
    font-size: 15px;
  }

  .media-top .handle{
    font-size: 12px;
    color: var(--muted);
  }

  .play-overlay{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    width: 64px;
    height: 46px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-overlay::after{
    content: "";
    border-style: solid;
    border-width: 10px 0 10px 17px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }

  .media-bottom{
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 14px;
    z-index: 1;
  }

  .media-title{
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0 0 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }

  .media-tags{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #ddd;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }

  .media-tags span:not(:last-child)::after{
    content: "•";
    margin-left: 8px;
    color: #999;
  }

  .card-actions{
    display: flex;
    gap: 10px;
    padding: 14px;
  }

  .btn{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border: none;
  }

  .btn-play{
    background: #fff;
    color: #111;
  }

  .btn-save{
    background: #3a3a3d;
    color: #fff;
  }

  /* ---------- 지금 뜨는 콘텐츠 ---------- */
  .section-title{
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .grid-card{
    display: block;
    text-decoration: none;
    color: var(--text);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card-bg);
  }

  .grid-card img{
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 14px;
  }
</style>
</head>
<body>

<div class="screen">

  <!-- ============================================================
       1) 상단 헤더
       - "재현 님" 이름 부분만 텍스트 수정하면 됩니다.
  ============================================================= -->
  <header class="header">
    <h1>도훈 님</h1>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </header>

  <!-- ============================================================
       2) 태그 버튼 (시리즈 / 영화 / 크리스마스)
       - 각 <a> 태그의 href="#"를 원하는 링크로 바꾸세요.
       - 버튼 안의 글자를 원하는 텍스트로 바꾸세요.
  ============================================================= -->
  <nav class="tag-row">
    <a class="tag-btn" href="https://intothedeepwaves.github.io/hbd/pic1.jpg" target="_blank" rel="noopener">시리즈</a>
    <a class="tag-btn" href="https://kko.to/cVUT2OvlrK" target="_blank" rel="noopener">영화</a>
    <a class="tag-btn" href="https://kko.to/HHxBfPVAB4" target="_blank" rel="noopener">생일 🎂</a>
  </nav>

  <!-- ============================================================
       3) 메인 콘텐츠 카드
       - 배경 썸네일: 아래 <img class="bg-img"> 의 src를 원하는
         이미지 URL로 바꾸세요.
       - 프로필 사진: <img class="avatar"> 의 src를 원하는
         이미지 URL로 바꾸세요.
       - 채널 이름 / 아이디: .channel-name, .handle 안의 텍스트를
         원하는 내용으로 바꾸세요.
       - "재생" / "내가 찜한 리스트" 버튼의 href와 텍스트를 바꾸세요.
  ============================================================= -->
  <article class="main-card">
    <div class="media">
      <img class="bg-img" src="https://placehold.co/640x800/222/888?text=%EC%B9%B4%EB%B2%84+%EC%9D%B4%EB%AF%B8%EC%A7%80" alt="썸네일 이미지">

      <div class="media-top">
        <img class="avatar" src="https://placehold.co/80x80/ddd/555?text=%40" alt="https://intothedeepwaves.github.io/hbd/pic2.jpg">
        <div class="names">
          <div class="channel-name">러브래또</div>
          <div class="handle">@dohoonnam</div>
        </div>
      </div>

      <div class="play-overlay"></div>

      <div class="media-bottom">
        <div class="media-tags">
          <span>사랑스러운</span>
          <span>로맨틱</span>
          <span>코미디</span>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <a class="btn btn-play" href="https://youtu.be/_P9ty76m5FU?si=fAldnz7lvQTFrGB8" target="_blank" rel="noopener">▶ 재생</a>
      <a class="btn btn-save" href="https://save.banggooso.com/gl/176/result?code=956347" target="_blank" rel="noopener">＋ 내가 찜한 리스트</a>
    </div>
  </article>

  <!-- ============================================================
       4) 지금 뜨는 콘텐츠 (하단 카드 2개, 이미지만)
       - 섹션 제목 텍스트 수정 가능
       - 각 카드는 <a> 태그이므로 href를 링크로 바꾸면
         카드를 눌렀을 때 이동합니다.
       - img src를 원하는 이미지 URL로 교체하세요.
  ============================================================= -->
  <section>
    <h2 class="section-title">지금 뜨는 콘텐츠</h2>
    <div class="grid">
      <a class="grid-card" href="#" target="_blank" rel="noopener">
        <img src="https://placehold.co/450x600/222/888?text=%EC%9D%B4%EB%AF%B8%EC%A7%80+1" alt="콘텐츠 1">
      </a>
      <a class="grid-card" href="#" target="_blank" rel="noopener">
        <img src="https://placehold.co/450x600/222/888?text=%EC%9D%B4%EB%AF%B8%EC%A7%80+2" alt="콘텐츠 2">
      </a>
    </div>
  </section>

</div>

</body>
</html>
