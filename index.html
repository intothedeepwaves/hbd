<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 콘텐츠 페이지</title>
<style>
  :root{
    --bg: #0b0b0c;
    --card-bg: #1a1a1c;
    --text: #f5f5f5;
    --muted: #b8b8b8;
    --accent: #ff2d3a; /* 재생 버튼 포인트 색상 */
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", sans-serif;
  }

  .screen{
    max-width: 430px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ---------- 상단 헤더 ---------- */
  .header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .header h1{
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .search-icon{
    width: 26px;
    height: 26px;
    color: var(--text);
  }

  /* ---------- 태그 버튼 ---------- */
  .tag-row{
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tag-btn{
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid #555;
    color: var(--text);
    font-size: 14px;
    text-decoration: none;
    white-space: nowrap;
  }

  .tag-btn:active{
    background: #2a2a2c;
  }

  /* ---------- 메인 카드 ---------- */
  .main-card{
    border-radius: 18px;
    overflow: hidden;
    background: var(--card-bg);
    margin-bottom: 28px;
  }

  .main-card .media{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #333;
    overflow: hidden;
  }

  .main-card .media > img.bg-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .media-top{
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
    flex-shrink: 0;
    display: block;
  }

  .media-top .names{
    line-height: 1.2;
  }

  .media-top .channel-name{
    font-weight: 700;
    font-size: 15px;
  }

  .media-top .handle{
    font-size: 12px;
    color: var(--muted);
  }

  .play-overlay{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    width: 64px;
    height: 46px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-overlay::after{
    content: "";
    border-style: solid;
    border-width: 10px 0 10px 17px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }

  .media-tags-center{
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #ddd;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }

  .media-tags-center span:not(:last-child)::after{
    content: "•";
    margin-left: 8px;
    color: #999;
  }

  .card-actions{
    display: flex;
    gap: 10px;
    padding: 14px;
  }

  .btn{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border: none;
  }

  .btn-play{
    background: #fff;
    color: #111;
  }

  .btn-save{
    background: #3a3a3d;
    color: #fff;
  }

  /* ---------- 지금 뜨는 콘텐츠 ---------- */
  .section-title{
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .grid-card{
    display: block;
    text-decoration: none;
    color: var(--text);
    border-radius: 14px;
    overflow: hidden;
    background: var(--card-bg);
  }

  .grid-card img{
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 14px;
  }
</style>
</head>
